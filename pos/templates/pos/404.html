{% extends "pos/base.html" %}

{% block title %}404 - Page Not Found | Spice & Flavor POS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 text-center">
            <div class="error-page-card p-5">
                <div class="mb-3 text-warning">
                    <span class="error-code d-block text-warning opacity-75">404</span>
                    <i class="fa-solid fa-utensils fs-1 mt-2"></i>
                </div>
                <h2 class="fw-bold text-white mb-2">Page Not Found</h2>
                <p class="text-secondary mb-4 fs-6">
                    The requested menu item, table, or page doesn't exist, has been moved, or you may not have authorization to view it.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a href="{% url 'home_redirect' %}" class="btn btn-primary-custom px-4 py-2 rounded-pill fw-semibold">
                        <i class="fa-solid fa-house me-2"></i>Return Home
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-semibold">
                        <i class="fa-solid fa-arrow-left me-2"></i>Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
